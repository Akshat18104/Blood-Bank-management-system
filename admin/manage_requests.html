<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Blood Requests — BBMS Admin</title>
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">
        <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        </div>
        <div><h1>BBMS</h1><span>Admin Panel</span></div>
    </div>
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="manage_users.html">Users</a>
        <a href="manage_requests.html" class="active">Requests</a>
        <a href="reports.html">Reports</a>
    </div>
    <div class="nav-right">
        <span class="live-clock" style="font-size:.78rem;color:var(--text-muted)"></span>
        <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme"></button>
        <div class="nav-user">
            <div class="nav-avatar" id="navAvatar">AD</div>
            <div>
                <div id="navUsername" style="font-size:.8rem">admin</div>
                <div class="role-tag" id="navRole">Admin</div>
            </div>
        </div>
        <button class="btn btn-sm btn-secondary" onclick="logout(event)">Logout</button>
    </div>
</nav>

<main class="page">
    <div class="page-header">
        <div>
            <h2>Ward Blood Requests</h2>
        </div>
    </div>

    <!-- Filter Buttons -->
    <div style="display:flex;gap:.5rem;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center;">
        <button class="btn btn-sm btn-secondary filter-btn active" data-filter="All">All Requests (<span id="countAll">0</span>)</button>
        <button class="btn btn-sm btn-secondary filter-btn" data-filter="Pending">Pending (<span id="countPending">0</span>)</button>
        <button class="btn btn-sm btn-secondary filter-btn" data-filter="Accepted">Accepted (<span id="countAccepted">0</span>)</button>
        <button class="btn btn-sm btn-secondary filter-btn" data-filter="Rejected">Rejected (<span id="countRejected">0</span>)</button>
    </div>

    <!-- Requests Table Card -->
    <div class="card">
        <div class="card-header">
            <h3>Requisition Log</h3>
            <span id="activeFilterLabel" class="badge badge-blue">Filter: All</span>
        </div>
        <div class="card-body p-0" id="requestsTableContainer">
            <div class="empty-state">Loading requisitions...</div>
        </div>
    </div>
</main>

<script src="../assets/app.js"></script>
<script>
let allRequests = [];
let currentFilter = 'All';
let inventoryStock = {};

async function loadRequestsData() {
    const data = await BBMS.loadShell('Admin');
    if (!data) return;

    allRequests = data.requests || [];
    inventoryStock = data.inventory || {};

    const counts = data.stats.counts || { All: 0, Pending: 0, Accepted: 0, Rejected: 0 };
    document.getElementById('countAll').textContent = counts.All || allRequests.length;
    document.getElementById('countPending').textContent = counts.Pending || 0;
    document.getElementById('countAccepted').textContent = counts.Accepted || 0;
    document.getElementById('countRejected').textContent = counts.Rejected || 0;

    renderRequestsTable();
}

function renderRequestsTable() {
    const filtered = currentFilter === 'All' ? allRequests : allRequests.filter(r => r.status === currentFilter);
    const container = document.getElementById('requestsTableContainer');
    document.getElementById('activeFilterLabel').textContent = `Filter: ${currentFilter} (${filtered.length})`;

    if (!filtered.length) {
        container.innerHTML = `<div class="empty-state">No ${currentFilter === 'All' ? '' : currentFilter.toLowerCase() + ' '}requests found.</div>`;
        return;
    }

    container.innerHTML = `
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Req #</th>
                        <th>Requester</th>
                        <th>Blood Group</th>
                        <th>Units</th>
                        <th>Stock Avail.</th>
                        <th>Status</th>
                        <th>Requested Date</th>
                        <th style="text-align:right;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${filtered.map(r => {
                        let statusBadge = 'badge-amber';
                        if (r.status === 'Accepted') statusBadge = 'badge-green';
                        else if (r.status === 'Rejected') statusBadge = 'badge-red';
                        const stockAvail = inventoryStock[r.blood_group] !== undefined ? inventoryStock[r.blood_group] : '—';
                        const isPending = r.status === 'Pending';
                        const hasEnough = stockAvail >= r.units_requested;

                        return `
                            <tr>
                                <td><strong>#${r.request_id}</strong></td>
                                <td><strong>${esc(r.username || ('User #' + r.requested_by))}</strong></td>
                                <td><span class="blood-tag">${esc(r.blood_group)}</span></td>
                                <td><strong>${r.units_requested}</strong> unit(s)</td>
                                <td>
                                    <span style="font-weight:600; color:${hasEnough ? 'var(--green)' : 'var(--crimson)'}">
                                        ${stockAvail} units
                                    </span>
                                </td>
                                <td><span class="badge ${statusBadge}">${esc(r.status)}</span></td>
                                <td style="font-size:.8rem;color:var(--text-secondary);">${formatDate(r.request_date)}</td>
                                <td style="text-align:right;">
                                    ${isPending ? `
                                        <div style="display:inline-flex;gap:.35rem;">
                                            <button class="btn btn-success btn-sm" onclick="handleDecision(${r.request_id}, 'accept', '${esc(r.blood_group)}', ${r.units_requested}, ${stockAvail})">
                                                Approve
                                            </button>
                                            <button class="btn btn-danger btn-sm" onclick="handleDecision(${r.request_id}, 'reject', '${esc(r.blood_group)}', ${r.units_requested})">
                                                Reject
                                            </button>
                                        </div>
                                    ` : `
                                        <span style="font-size:.75rem;color:var(--text-muted);font-weight:600;">Processed</span>
                                    `}
                                </td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        </div>
    `;
}

function handleDecision(id, decision, bg, units, avail) {
    if (decision === 'accept' && avail !== undefined && avail < units) {
        showAlert(`Insufficient ${bg} inventory! Available: ${avail} units, Requested: ${units} units.`, 'error');
        return;
    }

    const title = decision === 'accept' ? 'Approve Blood Requisition' : 'Reject Blood Requisition';
    const msg = decision === 'accept'
        ? `Approve Request #${id} and deduct ${units} unit(s) of ${bg} from central inventory?`
        : `Are you sure you want to reject Request #${id} for ${units} unit(s) of ${bg}?`;

    confirmModal({
        title,
        message: msg,
        confirmText: decision === 'accept' ? 'Approve & Dispatch' : 'Reject Requisition',
        confirmClass: decision === 'accept' ? 'btn-success' : 'btn-danger',
        onConfirm: async () => {
            const res = await BBMS.call('handle_request', { request_id: id, decision });
            if (res && res.ok) {
                showAlert(res.message || 'Request updated.', 'success');
                await loadRequestsData();
            } else {
                showAlert((res && res.error) || 'Failed to update request.', 'error');
            }
        }
    });
}

document.addEventListener('DOMContentLoaded', () => {
    loadRequestsData();

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderRequestsTable();
        });
    });
});
</script>
</body>
</html>
