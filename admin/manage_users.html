<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users — BBMS Admin</title>
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">
        <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        </div>
        <div><h1>BBMS</h1><span>Admin Panel</span></div>
    </div>
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="manage_users.html" class="active">Users</a>
        <a href="manage_requests.html">Requests</a>
        <a href="reports.html">Reports</a>
    </div>
    <div class="nav-right">
        <span class="live-clock" style="font-size:.78rem;color:var(--text-muted)"></span>
        <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme"></button>
        <div class="nav-user">
            <div class="nav-avatar" id="navAvatar">AD</div>
            <div>
                <div id="navUsername" style="font-size:.8rem">admin</div>
                <div class="role-tag" id="navRole">Admin</div>
            </div>
        </div>
        <button class="btn btn-sm btn-secondary" onclick="logout(event)">Logout</button>
    </div>
</nav>

<main class="page">
    <div class="page-header">
        <div>
            <h2>Manage System Users</h2>
        </div>
        <button class="btn btn-primary btn-sm" id="toggleAddBtn" onclick="toggleAddUserForm()">
            + Add New User
        </button>
    </div>

    <!-- Add User Form (Collapsible/Toggle) -->
    <div id="addUserCard" class="card" style="display:none; max-width:540px; margin-bottom:1.5rem;">
        <div class="card-header">
            <h3>Add System User</h3>
            <button type="button" class="btn btn-secondary btn-sm" onclick="toggleAddUserForm()">Cancel</button>
        </div>
        <div class="card-body">
            <form id="addUserForm" onsubmit="handleAddUser(event)">
                <div class="form-group">
                    <label class="form-label" for="newUsername">Username <span class="req">*</span></label>
                    <input type="text" id="newUsername" class="form-input" placeholder="e.g. nurse_sarah" required minlength="3">
                </div>
                <div class="form-group">
                    <label class="form-label" for="newPassword">Password <span class="req">*</span></label>
                    <input type="password" id="newPassword" class="form-input" placeholder="Min. 4 characters" required minlength="4">
                </div>
                <div class="form-group">
                    <label class="form-label" for="newRole">Role <span class="req">*</span></label>
                    <select id="newRole" class="form-select" required>
                        <option value="" disabled selected>-- Select System Role --</option>
                        <option value="Admin">Administrator</option>
                        <option value="Staff">Lab Staff</option>
                        <option value="Medical Staff">Medical Staff (Doctor/Nurse)</option>
                    </select>
                </div>
                <button type="submit" id="saveUserBtn" class="btn btn-primary btn-block">Create Account</button>
            </form>
        </div>
    </div>

    <!-- Users Table Card -->
    <div class="card">
        <div class="card-header">
            <h3>All Registered Accounts</h3>
            <span class="badge badge-blue" id="userCountBadge">0 Users</span>
        </div>
        <div class="card-body p-0" id="usersTableContainer">
            <div class="empty-state">Loading users...</div>
        </div>
    </div>
</main>

<script src="../assets/app.js"></script>
<script>
let usersList = [];

function toggleAddUserForm() {
    const card = document.getElementById('addUserCard');
    const isHidden = card.style.display === 'none';
    card.style.display = isHidden ? 'block' : 'none';
    if (isHidden) {
        document.getElementById('newUsername').focus();
    }
}

let currentUserId = null;

async function loadUsersData() {
    try {
        const data = await BBMS.loadShell('Admin');
        if (!data) return;

        if (data.user) currentUserId = data.user.user_id;
        usersList = data.users || [];
        renderUsersTable();
    } catch (err) {
        console.error('Failed to load users:', err);
        const container = document.getElementById('usersTableContainer');
        if (container) {
            container.innerHTML = `<div class="empty-state" style="color:var(--danger)">Failed to load users: ${esc(err.message || 'Unknown error')}</div>`;
        }
    }
}

function renderUsersTable() {
    const countBadge = document.getElementById('userCountBadge');
    if (countBadge) countBadge.textContent = `${usersList.length} Users`;

    const container = document.getElementById('usersTableContainer');
    if (!usersList.length) {
        container.innerHTML = '<div class="empty-state">No users registered yet.</div>';
        return;
    }

    container.innerHTML = `
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Username</th>
                        <th>Assigned Role</th>
                        <th>Created Date</th>
                        <th style="text-align:right;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${usersList.map(u => {
                        let roleBadge = 'badge-blue';
                        if (u.role === 'Admin') roleBadge = 'badge-red';
                        else if (u.role === 'Staff') roleBadge = 'badge-green';
                        else if (u.role === 'Medical Staff') roleBadge = 'badge-amber';

                        const isSelf = (currentUserId && currentUserId === u.user_id) || (BBMS.seedStore().session && BBMS.seedStore().session.user_id === u.user_id);

                        return `
                            <tr>
                                <td><strong>#${u.user_id}</strong></td>
                                <td><strong>${esc(u.username)}</strong></td>
                                <td><span class="badge ${roleBadge}">${esc(u.role)}</span></td>
                                <td style="font-size:.8rem;color:var(--text-secondary);">${formatDate(u.created_at)}</td>
                                <td style="text-align:right;">
                                    ${isSelf
                                        ? `<span style="font-size:.72rem;color:var(--text-muted);font-weight:600;">Current User</span>`
                                        : `<button class="btn btn-danger btn-sm" onclick="confirmDeleteUser(${u.user_id}, '${esc(u.username)}')">Delete</button>`
                                    }
                                </td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        </div>
    `;
}

async function handleAddUser(e) {
    e.preventDefault();
    const username = document.getElementById('newUsername').value.trim();
    const password = document.getElementById('newPassword').value;
    const role = document.getElementById('newRole').value;

    if (!username || !password || !role) {
        showAlert('Please fill all fields.', 'error');
        return;
    }

    const btn = document.getElementById('saveUserBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const res = await BBMS.call('add_user', { username, password, role });
    btn.disabled = false;
    btn.textContent = 'Create Account';

    if (res && res.ok) {
        showAlert(res.message || 'User created successfully!', 'success');
        document.getElementById('addUserForm').reset();
        document.getElementById('addUserCard').style.display = 'none';
        await loadUsersData();
    } else {
        showAlert((res && res.error) || 'Failed to create user.', 'error');
    }
}

function confirmDeleteUser(userId, username) {
    confirmModal({
        title: 'Delete User Account',
        message: `Are you sure you want to delete user "${username}" (ID #${userId})? This action cannot be undone.`,
        confirmText: 'Delete Account',
        confirmClass: 'btn-danger',
        onConfirm: async () => {
            const res = await BBMS.call('delete_user', { user_id: userId });
            if (res && res.ok) {
                showAlert(res.message || 'User account removed.', 'success');
                await loadUsersData();
            } else {
                showAlert((res && res.error) || 'Could not delete user.', 'error');
            }
        }
    });
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadUsersData);
} else {
    loadUsersData();
}
</script>
</body>
</html>
