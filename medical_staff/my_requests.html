<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests — IBBMS</title>
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">
        <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        </div>
        <div><h1>IBBMS</h1><span>Medical Staff</span></div>
    </div>
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="request_blood.html">Request Blood</a>
        <a href="my_requests.html" class="active">My Requests</a>
    </div>
    <div class="nav-right">
        <span class="live-clock" style="font-size:.78rem;color:var(--text-muted)"></span>
        <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme"></button>
        <div class="nav-user">
            <div class="nav-avatar" id="navAvatar">DR</div>
            <div>
                <div id="navUsername" style="font-size:.8rem">doctor</div>
                <div class="role-tag" id="navRole">Medical Staff</div>
            </div>
        </div>
        <button class="btn btn-sm btn-secondary" onclick="logout(event)">Logout</button>
    </div>
</nav>

<main class="page">
    <div class="page-header">
        <div>
            <h2>My Requisition History</h2>
            <p>All blood orders submitted by your clinical unit. You can cancel any pending requests.</p>
        </div>
        <a href="request_blood.html" class="btn btn-primary btn-sm">+ New Request</a>
    </div>

    <!-- Filters -->
    <div style="display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap;">
        <button class="btn btn-sm btn-secondary filter-btn active" data-filter="All">All</button>
        <button class="btn btn-sm btn-secondary filter-btn" data-filter="Pending">Pending</button>
        <button class="btn btn-sm btn-secondary filter-btn" data-filter="Accepted">Accepted</button>
        <button class="btn btn-sm btn-secondary filter-btn" data-filter="Rejected">Rejected</button>
        <button class="btn btn-sm btn-secondary filter-btn" data-filter="Cancelled">Cancelled</button>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>Ward Orders Record</h3>
            <span id="orderCountBadge" class="badge badge-blue">0 Orders</span>
        </div>
        <div class="card-body p-0" id="requestsBox">
            <div class="empty-state">Loading your requisitions...</div>
        </div>
    </div>
</main>

<script src="../assets/app.js"></script>
<script>
let allRequests = [];
let currentFilter = 'All';

async function loadRequests() {
    const data = await IBBMS.loadShell('Medical Staff');
    if (!data) return;
    allRequests = data.requests || [];
    renderTable();
}

function renderTable() {
    const filtered = currentFilter === 'All' ? allRequests : allRequests.filter(r => r.status === currentFilter);
    const badge = document.getElementById('orderCountBadge');
    if (badge) badge.textContent = `${filtered.length} Orders`;

    const box = document.getElementById('requestsBox');
    if (!filtered.length) {
        box.innerHTML = `<div class="empty-state">No ${currentFilter === 'All' ? '' : currentFilter.toLowerCase() + ' '}requests found.</div>`;
        return;
    }

    box.innerHTML = `
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Req #</th>
                        <th>Blood Group</th>
                        <th>Units</th>
                        <th>Status</th>
                        <th>Submitted Date</th>
                        <th style="text-align:right;">Action</th>
                    </tr>
                </thead>
                <tbody>
                    ${filtered.map(r => {
                        let bc = 'badge-amber';
                        if (r.status === 'Accepted') bc = 'badge-green';
                        else if (r.status === 'Rejected') bc = 'badge-red';
                        else if (r.status === 'Cancelled') bc = 'badge-gray';

                        const isPending = r.status === 'Pending';
                        const actionHtml = isPending
                            ? `<button class="btn btn-danger btn-sm" onclick="cancelOrder(${r.request_id}, '${esc(r.blood_group)}', ${r.units_requested})">Cancel</button>`
                            : `<span style="font-size:.78rem;color:var(--text-muted);font-weight:600;">—</span>`;

                        return `
                            <tr>
                                <td><strong>#${r.request_id}</strong></td>
                                <td><span class="blood-tag">${esc(r.blood_group)}</span></td>
                                <td><strong>${r.units_requested}</strong> unit(s)</td>
                                <td><span class="badge ${bc}">${esc(r.status)}</span></td>
                                <td style="font-size:.8rem;color:var(--text-secondary);">${formatDate(r.request_date)}</td>
                                <td style="text-align:right;">${actionHtml}</td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        </div>
    `;
}

function cancelOrder(reqId, bg, units) {
    confirmModal({
        title: 'Cancel Blood Request',
        message: `Are you sure you want to cancel Request #${reqId} for ${units} unit(s) of ${bg}? This action cannot be undone.`,
        confirmText: 'Yes, Cancel Request',
        confirmClass: 'btn-danger',
        onConfirm: async () => {
            const res = await IBBMS.call('cancel_request', { request_id: reqId });
            if (res && res.ok) {
                showAlert(res.message || 'Request cancelled successfully.', 'success');
                await loadRequests();
            } else {
                showAlert((res && res.error) || 'Failed to cancel request.', 'error');
            }
        }
    });
}

document.addEventListener('DOMContentLoaded', () => {
    loadRequests();

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderTable();
        });
    });
});
</script>
</body>
</html>
