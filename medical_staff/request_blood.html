<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Blood — IBBMS</title>
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-brand">
        <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        </div>
        <div><h1>IBBMS</h1><span>Medical Staff</span></div>
    </div>
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="request_blood.html" class="active">Request Blood</a>
        <a href="my_requests.html">My Requests</a>
    </div>
    <div class="nav-right">
        <span class="live-clock" style="font-size:.78rem;color:var(--text-muted)"></span>
        <button class="theme-btn" onclick="toggleTheme()"></button>
        <div class="nav-user">
            <div class="nav-avatar" id="navAvatar">DR</div>
            <div><div id="navUsername" style="font-size:.8rem">doctor</div><div class="role-tag" id="navRole">Medical Staff</div></div>
        </div>
        <button class="btn btn-sm btn-secondary" onclick="logout(event)">Logout</button>
    </div>
</nav>

<main class="page">
    <div class="page-header">
        <div>
            <h2>Request Blood Units</h2>
            <p>Submit a blood requisition for your ward or patient.</p>
        </div>
        <a href="my_requests.html" class="btn btn-secondary btn-sm">View My Requests →</a>
    </div>

    <div style="max-width:520px">
        <div class="card">
            <div class="card-header">
                <h3>New Blood Requisition</h3>
            </div>
            <div class="card-body">
                <form id="requestForm" novalidate>
                    <div class="form-group">
                        <label class="form-label">Blood Group <span class="req">*</span></label>
                        <select id="bloodGroup" class="form-select" required>
                            <option value="">Select blood group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Units Required <span class="req">*</span></label>
                        <input type="number" id="units" class="form-input" min="1" max="10" value="1" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Submit Request</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Current Availability -->
    <div class="card" style="margin-top:1.5rem">
        <div class="card-header">
            <h3>Current Blood Availability</h3>
        </div>
        <div class="card-body">
            <div class="blood-grid" id="stockGrid"></div>
        </div>
    </div>
</main>

<script src="../assets/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    const data = await IBBMS.loadShell('Medical Staff');
    if (!data) return;

    // Pre-select group from URL
    const params = new URLSearchParams(location.search);
    const preGroup = params.get('group');
    if (preGroup) document.getElementById('bloodGroup').value = preGroup;

    // Show availability
    document.getElementById('stockGrid').innerHTML = BLOOD_GROUPS.map(bg => {
        const u = data.inventory[bg] || 0;
        const pct = Math.min(100, Math.round((u / 25) * 100));
        const cls = u === 0 ? 'critical' : u <= 5 ? 'low' : '';
        return `<div class="blood-item ${cls}">
            <div class="group-name">${esc(bg)}</div>
            <div class="group-units">${u}</div>
            <div class="group-label">units</div>
            <div class="meter"><div class="meter-fill" style="width:${Math.max(5,pct)}%"></div></div>
        </div>`;
    }).join('');

    // Form submit
    document.getElementById('requestForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const bg = document.getElementById('bloodGroup').value;
        const units = parseInt(document.getElementById('units').value);
        if (!bg || units < 1 || units > 10) {
            showAlert('Select a blood group and enter 1-10 units.', 'error');
            return;
        }
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.textContent = 'Submitting...';
        const res = await IBBMS.call('request_blood', { blood_group: bg, units_requested: units });
        showAlert(res.message || res.error, res.ok ? 'success' : 'error');
        btn.disabled = false; btn.textContent = 'Submit Request';
        if (res.ok) {
            document.getElementById('requestForm').reset();
        }
    });
});
</script>
</body>
</html>
